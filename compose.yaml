name: ${COMPOSE_PROJECT_NAME:-n3-test}

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.8.9}
    restart: "no"
    init: true
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env.docker}
      MARIADB_DATABASE: ${N3_TEST_DB_NAME:?Set N3_TEST_DB_NAME in .env.docker}
      N3_DB_RUNTIME_USER: ${N3_TEST_DB_USER:?Set N3_TEST_DB_USER in .env.docker}
      N3_DB_RUNTIME_PASSWORD: ${N3_TEST_DB_PASSWORD:?Set N3_TEST_DB_PASSWORD in .env.docker}
      N3_DB_MIGRATION_USER: ${N3_TEST_DB_MIGRATION_USER:?Set N3_TEST_DB_MIGRATION_USER in .env.docker}
      N3_DB_MIGRATION_PASSWORD: ${N3_TEST_DB_MIGRATION_PASSWORD:?Set N3_TEST_DB_MIGRATION_PASSWORD in .env.docker}
      N3_DB_BACKUP_USER: ${N3_TEST_DB_BACKUP_USER:?Set N3_TEST_DB_BACKUP_USER in .env.docker}
      N3_DB_BACKUP_PASSWORD: ${N3_TEST_DB_BACKUP_PASSWORD:?Set N3_TEST_DB_BACKUP_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${N3_TEST_DB_HOST_PORT:-3307}:3306"
    volumes:
      - n3_mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/php-test/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    working_dir: /app
    environment:
      APP_ENV: test
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${N3_TEST_DB_NAME:?Set N3_TEST_DB_NAME in .env.docker}
      DB_USER: ${N3_TEST_DB_USER:?Set N3_TEST_DB_USER in .env.docker}
      DB_PASSWORD: ${N3_TEST_DB_PASSWORD:?Set N3_TEST_DB_PASSWORD in .env.docker}
      DB_MIGRATION_USER: ${N3_TEST_DB_MIGRATION_USER:?Set N3_TEST_DB_MIGRATION_USER in .env.docker}
      DB_MIGRATION_PASSWORD: ${N3_TEST_DB_MIGRATION_PASSWORD:?Set N3_TEST_DB_MIGRATION_PASSWORD in .env.docker}
      N3_TEST_DB_HOST: mariadb
      N3_TEST_DB_PORT: 3306
      N3_TEST_DB_NAME: ${N3_TEST_DB_NAME:?Set N3_TEST_DB_NAME in .env.docker}
      N3_TEST_DB_USER: ${N3_TEST_DB_USER:?Set N3_TEST_DB_USER in .env.docker}
      N3_TEST_DB_PASSWORD: ${N3_TEST_DB_PASSWORD:?Set N3_TEST_DB_PASSWORD in .env.docker}
      N3_TEST_DB_MIGRATION_USER: ${N3_TEST_DB_MIGRATION_USER:?Set N3_TEST_DB_MIGRATION_USER in .env.docker}
      N3_TEST_DB_MIGRATION_PASSWORD: ${N3_TEST_DB_MIGRATION_PASSWORD:?Set N3_TEST_DB_MIGRATION_PASSWORD in .env.docker}
      N3_TEST_DB_BACKUP_USER: ${N3_TEST_DB_BACKUP_USER:?Set N3_TEST_DB_BACKUP_USER in .env.docker}
      N3_TEST_DB_BACKUP_PASSWORD: ${N3_TEST_DB_BACKUP_PASSWORD:?Set N3_TEST_DB_BACKUP_PASSWORD in .env.docker}
    volumes:
      - ./.htaccess:/app/.htaccess:ro
      - ./bin:/app/bin:ro
      - ./bootstrap:/app/bootstrap:ro
      - ./config:/app/config:ro
      - ./database:/app/database:ro
      - ./public:/app/public:ro
      - ./resources:/app/resources:ro
      - ./src:/app/src:ro
      - ./storage:/app/storage:ro
      - ./tests:/app/tests:ro
      - ./vendor:/app/vendor:ro
      - ./phpunit.xml:/app/phpunit.xml:ro
    tmpfs:
      - /tmp
    command: ["php", "vendor/bin/phpunit", "--do-not-record-test-run-history"]

volumes:
  n3_mariadb_data:
